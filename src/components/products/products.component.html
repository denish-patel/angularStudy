
<div class="flex flex-wrap">
    @for (item of products$; track item.title) {
        <div class="max-w-sm w-full bg-white rounded shadow-lg overflow-hidden relative m-4">
            <span class="absolute bg-red text-white text-xs font-bold px-2 py-1 m-2 rounded">
                SALE
            </span>
            <div class="h-48 w-full bg-grey-light flex items-center justify-center overflow-hidden">
                <img class="object-cover w-full h-full" src="{{item.images[0]}}" alt="Nike Shoe">
            </div>
            <div class="px-6 py-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-xl mb-2 mr-2 text-grey-darkest leading-[1.3]">{{item.title}}</h2>
                    <span class="text-xs text-grey-dark uppercase tracking-wide">{{item.type}}</span>
                </div>
                <p class="text-grey-darker text-base leading-normal truncate" title="{{item.description}}">{{item.description}}</p>
                <div class="flex justify-between pt-5 items-center">
                    <div class="flex flex-col">
                        <!-- <span class="text-grey-dark line-through text-sm">${{item.oldPrice}}</span> -->
                        <span class="text-2xl font-bold text-grey-darkest">${{item.price}}</span>
                    </div>
                    <button class="bg-blue hover:bg-blue-dark text-black font-bold py-2 px-4 rounded shadow focus:outline-none focus:shadow-outline transition">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>
    }
</div>
